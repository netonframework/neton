name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  framework-checks:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Compile framework
        run: ./gradlew compileKotlinMacosArm64

      - name: Run security tests
        run: ./gradlew :neton-security:macosArm64Test

      - name: Run logging redaction contract
        run: ./gradlew :neton-logging:macosArm64Test --tests 'neton.logging.internal.JsonLoggerContractTest.sensitiveRedaction_expandedSensitiveKeys'
