name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  framework-checks:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Compile framework
        run: ./gradlew compileKotlinMacosArm64

      - name: Run foundation tests
        run: ./gradlew :neton-core:macosArm64Test :neton-http:macosArm64Test :neton-database:macosArm64Test :neton-logging:macosArm64Test :neton-security:macosArm64Test

      - name: Run logging redaction contract
        run: ./gradlew :neton-logging:macosArm64Test --tests 'neton.logging.internal.JsonLoggerContractTest.sensitiveRedaction_expandedSensitiveKeys'

  native-core-checks:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linuxX64
            gradle: ./gradlew
          - os: windows-2022
            target: mingwX64
            gradle: ./gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Configure MinGW toolchain
        if: matrix.target == 'mingwX64'
        shell: pwsh
        run: |
          "NETON_MINGW_X64_CC=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
          "NETON_MINGW_X64_AR=C:\msys64\mingw64\bin\ar.exe" >> $env:GITHUB_ENV

      - name: Run native Core tests
        run: ${{ matrix.gradle }} --no-daemon :neton-core:${{ matrix.target }}Test
