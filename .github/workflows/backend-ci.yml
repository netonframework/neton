name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  framework-checks:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Compile framework
        run: ./gradlew compileKotlinMacosArm64

      - name: One outbound HTTP path (spec http-engine.md rule 4)
        run: |
          if grep -rn "io\.ktor" --include='*.kt' --include='*.kts' . \
               | grep -Ev '^(\./)?(neton-http-ktor|examples)/' \
               | grep -v '/build/'; then
            echo "::error::io.ktor is referenced outside neton-http-ktor. Framework modules must use neton.http.client.HttpClient."
            exit 1
          fi

      - name: Run foundation tests
        run: ./gradlew :neton-core:macosArm64Test :neton-http:macosArm64Test :neton-database:macosArm64Test :neton-logging:macosArm64Test :neton-security:macosArm64Test

      - name: Run HTTP engine conformance suites
        run: ./gradlew :neton-http-ktor:macosArm64Test :neton-http-hyper4k:macosArm64Test :neton-ai:macosArm64Test :neton-storage:macosArm64Test

      - name: Run logging redaction contract
        run: ./gradlew :neton-logging:macosArm64Test --tests 'neton.logging.internal.JsonLoggerContractTest.sensitiveRedaction_expandedSensitiveKeys'

  native-core-checks:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linuxX64
            gradle: ./gradlew
          - os: windows-2022
            target: mingwX64
            gradle: ./gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run native Core tests
        if: matrix.target != 'mingwX64'
        run: ${{ matrix.gradle }} --no-daemon :neton-core:${{ matrix.target }}Test

      - name: Run native Core tests
        if: matrix.target == 'mingwX64'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "neton-mingw-test.log"
          & .\gradlew.bat --no-daemon --stacktrace :neton-core:mingwX64Test 2>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content $log |
              Select-String -Pattern "error:|FAILED|FAILURE:|Exception|undefined reference|unresolved reference|Missing compiler|Missing archiver" |
              Select-Object -Last 20 |
              ForEach-Object {
                $message = $_.Line.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                Write-Output "::error::$message"
              }
            exit $exitCode
          }
