name: Backend CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'ci/**'

jobs:
  postgres-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: neton_gate
          POSTGRES_PASSWORD: disposable_gate_only
          POSTGRES_DB: neton_gate_ci
        ports:
          - 16439:5432
        options: >-
          --health-cmd "pg_isready -U neton_gate -d neton_gate_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Real PostgreSQL migration and transaction contracts (required)
        env:
          NETON_DB_TEST_REQUIRED: "true"
          NETON_DB_TEST_URI: postgresql://neton_gate:disposable_gate_only@127.0.0.1:16439/neton_gate_ci
        run: ./gradlew --no-daemon --warning-mode=fail -I tools/ci/require-published-dependencies.init.gradle -Pnetonstream.local=false -Pneton.database.driver=postgres :neton-database:linuxX64Test
      - name: Reject absent, skipped or failed database contracts
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_integration_report.py'
          python3 tools/ci/verify-integration-report.py neton-database/build/test-results/linuxX64Test
      - name: Retain database test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-contracts-${{ github.sha }}
          path: neton-database/build/test-results/linuxX64Test/
          if-no-files-found: error

  redis-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.2.7
        ports:
          - 16387:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Redis batch contracts against a real server
        env:
          NETON_TEST_REDIS_REQUIRED: "true"
          NETON_TEST_REDIS_PORT: "16387"
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=false :neton-redis:linuxX64Test
      - name: Verify Redis executed against the real server
        run: python3 tools/ci/verify-integration-report.py neton-redis/build/test-results/linuxX64Test redis
      - name: Retain Redis test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-contracts-${{ github.sha }}
          path: neton-redis/build/test-results/linuxX64Test/
          if-no-files-found: error

  framework-checks:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Checkout pinned protocol sources
        shell: bash
        run: bash tools/ci/checkout-protocols.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Compile framework
        run: ./gradlew --warning-mode=fail -Pnetonstream.local=true -Pnetonstream.local.openssl=true -PnativeTargets=all compileKotlinMacosArm64

      - name: One outbound HTTP path (spec http-engine.md rule 4)
        run: |
          # Sources: no io.ktor import outside the Ktor engine module.
          # Build files: no Ktor coordinate or catalog alias either. neton-core once
          # carried five ktor-server dependencies nothing referenced; every binary
          # linked them anyway.
          if grep -rnE "io\.ktor|libs\.ktor" --include='*.kt' --include='*.kts' . \
               | grep -Ev '^(\./)?(neton-http-ktor|examples)/' \
               | grep -v '/build/'; then
            echo "::error::Ktor is referenced outside neton-http-ktor. Framework modules must use neton.http.client.HttpClient (spec http-engine.md rule 4)."
            exit 1
          fi

      - name: Run foundation tests
        run: ./gradlew --warning-mode=fail -Pnetonstream.local=true -Pnetonstream.local.openssl=true -PnativeTargets=all :neton-core:macosArm64Test :neton-http:macosArm64Test :neton-database:macosArm64Test :neton-logging:macosArm64Test :neton-security:macosArm64Test :neton-cache:macosArm64Test :neton-jobs:macosArm64Test :neton-routing:macosArm64Test :neton-websocket:macosArm64Test :neton-ksp:test

      - name: Run HTTP engine conformance suites
        run: ./gradlew --warning-mode=fail -Pnetonstream.local=true -Pnetonstream.local.openssl=true -PnativeTargets=all :neton-http-ktor:macosArm64Test :neton-http-hyper4k:macosArm64Test :neton-ai:macosArm64Test :neton-storage:macosArm64Test

      - name: Run logging redaction contract
        run: ./gradlew --warning-mode=fail -Pnetonstream.local=false :neton-logging:macosArm64Test --tests 'neton.logging.internal.JsonLoggerContractTest.sensitiveRedaction_expandedSensitiveKeys'

  native-core-checks:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linuxX64
            gradle: ./gradlew
          - os: windows-2022
            target: mingwX64
            gradle: ./gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run native Core tests
        if: matrix.target != 'mingwX64'
        run: ${{ matrix.gradle }} --no-daemon --warning-mode=fail -I tools/ci/require-published-dependencies.init.gradle -Pnetonstream.local=false :neton-core:${{ matrix.target }}Test :neton-cache:${{ matrix.target }}Test :neton-jobs:${{ matrix.target }}Test :neton-security:${{ matrix.target }}Test

      - name: Run native Core tests
        if: matrix.target == 'mingwX64'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "neton-mingw-test.log"
          # Treat dotted -P arguments as literal strings in PowerShell, not expressions.
          $gradleArgs = @(
            '--no-daemon', '--stacktrace', '--warning-mode=fail',
            '-I', 'tools/ci/require-published-dependencies.init.gradle',
            '-Pnetonstream.local=false',
            ':neton-core:mingwX64Test', ':neton-cache:mingwX64Test',
            ':neton-jobs:mingwX64Test', ':neton-security:mingwX64Test'
          )
          & .\gradlew.bat @gradleArgs 2>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content $log |
              Select-String -Pattern "error:|FAILED|FAILURE:|Exception|undefined reference|unresolved reference|Missing compiler|Missing archiver" |
              Select-Object -Last 20 |
              ForEach-Object {
                $message = $_.Line.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                Write-Output "::error::$message"
              }
            exit $exitCode
          }
