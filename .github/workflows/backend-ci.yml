name: Backend CI

env:
  PYTHONDONTWRITEBYTECODE: "1"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'ci/**'

jobs:
  api-abi:
    name: Compiled API ABI baseline
    runs-on: macos-15
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Require complete ABI inventory and database boundary
        run: |
          python3 -m unittest discover -s tools/ci -p test_abi_policy.py
          python3 tools/ci/verify_abi_policy.py
      - name: Check every published Kotlin library against committed ABI
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=false checkKotlinAbi
      - name: Check MySQL variant against the same database API
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=false -Pneton.database.driver=mysql :neton-database:checkKotlinAbi
      - name: Check SQLite variant against the same database API
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=false -Pneton.database.driver=sqlite :neton-database:checkKotlinAbi
      - name: Baselines must not be rewritten by CI
        run: git diff --exit-code -- '**/api/**'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abi-reports-${{ github.sha }}
          path: |
            **/build/reports/abi/**
            **/build/kotlin/abi/**
          if-no-files-found: error

  ksp-incremental:
    name: KSP incremental (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macosArm64
          - os: ubuntu-24.04
            target: linuxX64
          - os: ubuntu-24.04
            target: linuxArm64
            extra: --defer-native-execution
          - os: windows-2022
            target: mingwX64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use the accepted Apple toolchain
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Provide ARM64 C bridge cross-compiler
        if: matrix.target == 'linuxArm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Test rejection of stale or missing generated code
        run: python -m unittest discover -s tools/ci -p test_ksp_incremental_gate.py
      - name: Native clean, no-op, add, modify and delete
        run: python tools/ci/ksp_incremental_gate.py --target ${{ matrix.target }} ${{ matrix.extra }} --output "${{ runner.temp }}/ksp-incremental-evidence"
      - name: Retain incremental evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksp-incremental-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/ksp-incremental-evidence/
          if-no-files-found: error

  ksp-arm64-runtime:
    name: KSP incremental native ARM64 execution
    needs: ksp-incremental
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ksp-incremental-linuxArm64-${{ github.sha }}
          path: ${{ runner.temp }}/ksp-cross-artifact
      - name: Verify and run all five compiled stages on ARM64
        run: python3 tools/ci/ksp_incremental_gate.py --target linuxArm64 --run-artifact "${{ runner.temp }}/ksp-cross-artifact" --output "${{ runner.temp }}/ksp-native-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ksp-incremental-linuxArm64-native-${{ github.sha }}
          path: ${{ runner.temp }}/ksp-native-evidence/
          if-no-files-found: error

  reference-release:
    name: Reference release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macosArm64
          - os: ubuntu-24.04
            target: linuxX64
          - os: windows-2022
            target: mingwX64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provide macOS PostgreSQL tooling
        if: runner.os == 'macOS'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          brew list --versions postgresql@16 || brew install postgresql@16
          echo "GATE_PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - name: Provide Linux PostgreSQL tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "GATE_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Extract verified Windows PostgreSQL tooling (no system service)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-16.15-5.zip'
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-16.15-5-windows-x64-binaries.zip' -OutFile $archive
          # Vendor checksum: https://github.com/EnterpriseDB/edb-installers/issues/731
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '43bb45f173a6f08cf1d29a97a6d8deb119e8e8093a24c00d2d1001a0ccaa8281') { throw 'PostgreSQL archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'postgresql-tooling'
          Expand-Archive $archive -DestinationPath $destination
          "GATE_PG_BIN=$destination\pgsql\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify smoke harness failure paths
        run: python -m unittest discover -s tools/ci -p test_reference_gate.py
      - name: Build release twice and verify migration and two shutdown cycles
        run: python tools/ci/reference_gate.py --target ${{ matrix.target }} --dependencies published --pg-bin "${{ env.GATE_PG_BIN }}" --output "${{ runner.temp }}/neton-reference-evidence"
      - name: Retain reference release evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-release-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/neton-reference-evidence/
          if-no-files-found: error

  candidate-artifacts:
    name: Signed local candidate artifacts
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/wrapper-validation@v3
      - name: Prepare isolated gate tooling
        run: brew install postgresql@16 gnupg
      - name: Reject incomplete or tampered candidate fixtures
        run: python3 -m unittest discover -s tools/ci -p test_candidate_artifacts.py
      - name: Stage, verify and consume candidate without remote publication
        run: python3 tools/ci/candidate_gate.py --pg-bin "$(brew --prefix postgresql@16)/bin" --output "$RUNNER_TEMP/neton-candidate-evidence"
      - name: Retain evidence and local candidate repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-artifacts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/neton-candidate-evidence/evidence.json
            ${{ runner.temp }}/neton-candidate-evidence/*.log
            ${{ runner.temp }}/neton-candidate-evidence/test-public-key.asc
            ${{ runner.temp }}/neton-candidate-evidence/repository
          if-no-files-found: error

  release-gates:
    name: Neton release gates
    if: always()
    needs: [reference-release, framework-checks, native-core-checks, postgres-contracts, redis-contracts, ksp-incremental, ksp-arm64-runtime, api-abi, candidate-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate on this candidate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; results=json.loads(os.environ["RESULTS"]); assert len(results)==9 and all(job["result"]=="success" for job in results.values()), results'

  postgres-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: neton_gate
          POSTGRES_PASSWORD: disposable_gate_only
          POSTGRES_DB: neton_gate_ci
        ports:
          - 16439:5432
        options: >-
          --health-cmd "pg_isready -U neton_gate -d neton_gate_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Real PostgreSQL migration and transaction contracts (required)
        env:
          NETON_DB_TEST_REQUIRED: "true"
          NETON_DB_TEST_URI: postgresql://neton_gate:disposable_gate_only@127.0.0.1:16439/neton_gate_ci
        run: ./gradlew --no-daemon --warning-mode=fail -I tools/ci/require-published-dependencies.init.gradle -Pnetonstream.local=false -Pneton.database.driver=postgres :neton-database:linuxX64Test
      - name: Reject absent, skipped or failed database contracts
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_integration_report.py'
          python3 tools/ci/verify-integration-report.py neton-database/build/test-results/linuxX64Test
      - name: Retain database test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-contracts-${{ github.sha }}
          path: neton-database/build/test-results/linuxX64Test/
          if-no-files-found: error

  redis-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.2.7
        ports:
          - 16387:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Redis batch contracts against a real server
        env:
          NETON_TEST_REDIS_REQUIRED: "true"
          NETON_TEST_REDIS_PORT: "16387"
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=false :neton-redis:linuxX64Test
      - name: Verify Redis executed against the real server
        run: python3 tools/ci/verify-integration-report.py neton-redis/build/test-results/linuxX64Test redis
      - name: Retain Redis test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-contracts-${{ github.sha }}
          path: neton-redis/build/test-results/linuxX64Test/
          if-no-files-found: error

  framework-checks:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Checkout pinned protocol sources
        shell: bash
        run: bash tools/ci/checkout-protocols.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Compile framework
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=true -Pnetonstream.local.openssl=true -PnativeTargets=all compileKotlinMacosArm64

      - name: One outbound HTTP path (spec http-engine.md rule 4)
        run: |
          # Ktor compatibility adapters live outside this repository.
          # Build files: no Ktor coordinate or catalog alias either. neton-core once
          # carried five ktor-server dependencies nothing referenced; every binary
          # linked them anyway.
          if grep -rnE "io\.ktor|libs\.ktor" --include='*.kt' --include='*.kts' . \
               | grep -v '/build/'; then
            echo "::error::Ktor is referenced in the framework. Compatibility adapters belong in independent repositories."
            exit 1
          fi

      - name: Run foundation tests
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=true -Pnetonstream.local.openssl=true -PnativeTargets=all :neton-core:macosArm64Test :neton-http:macosArm64Test :neton-database:macosArm64Test :neton-logging:macosArm64Test :neton-security:macosArm64Test :neton-cache:macosArm64Test :neton-jobs:macosArm64Test :neton-routing:macosArm64Test :neton-websocket:macosArm64Test :neton-ksp:test

      - name: Run AI and storage integration tests
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=true -Pnetonstream.local.openssl=true -PnativeTargets=all :neton-ai:macosArm64Test :neton-storage:macosArm64Test

      - name: Run logging redaction contract
        run: ./gradlew --no-daemon --warning-mode=fail -Pnetonstream.local=false :neton-logging:macosArm64Test --tests 'neton.logging.internal.JsonLoggerContractTest.sensitiveRedaction_expandedSensitiveKeys'

  native-core-checks:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linuxX64
            gradle: ./gradlew
          - os: windows-2022
            target: mingwX64
            gradle: ./gradlew.bat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run native Core tests
        if: matrix.target != 'mingwX64'
        run: ${{ matrix.gradle }} --no-daemon --warning-mode=fail -I tools/ci/require-published-dependencies.init.gradle -Pnetonstream.local=false :neton-core:${{ matrix.target }}Test :neton-cache:${{ matrix.target }}Test :neton-jobs:${{ matrix.target }}Test :neton-security:${{ matrix.target }}Test

      - name: Run native Core tests
        if: matrix.target == 'mingwX64'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "neton-mingw-test.log"
          # Treat dotted -P arguments as literal strings in PowerShell, not expressions.
          $gradleArgs = @(
            '--no-daemon', '--stacktrace', '--warning-mode=fail',
            '-I', 'tools/ci/require-published-dependencies.init.gradle',
            '-Pnetonstream.local=false',
            ':neton-core:mingwX64Test', ':neton-cache:mingwX64Test',
            ':neton-jobs:mingwX64Test', ':neton-security:mingwX64Test'
          )
          & .\gradlew.bat @gradleArgs 2>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content $log |
              Select-String -Pattern "error:|FAILED|FAILURE:|Exception|undefined reference|unresolved reference|Missing compiler|Missing archiver" |
              Select-Object -Last 20 |
              ForEach-Object {
                $message = $_.Line.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                Write-Output "::error::$message"
              }
            exit $exitCode
          }
