name: External configuration contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/external-config-contract.yml'
      - 'examples/external-config-contract/**'
      - 'neton-core/**'
      - 'neton-http/**'
      - 'tools/ci/consul_contract.py'
      - 'tools/ci/external_config_contract.py'
      - 'tools/ci/require-published-dependencies.init.gradle'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  push:
    branches: [main, verify/n12-14-linux]
    paths:
      - '.github/workflows/external-config-contract.yml'
      - 'examples/external-config-contract/**'
      - 'neton-core/**'
      - 'neton-http/**'
      - 'tools/ci/consul_contract.py'
      - 'tools/ci/external_config_contract.py'
      - 'tools/ci/require-published-dependencies.init.gradle'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  linux-x64:
    name: Consul KV and two Linux Neton instances
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare pinned Consul fixture
        shell: bash
        run: |
          archive=consul_1.16.2_linux_amd64.zip
          curl --fail --silent --show-error --location --retry 3 \
            "https://releases.hashicorp.com/consul/1.16.2/$archive" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' '2c87fffbb8abb3ba776519514db659f174a7c5b65faad7818457049ca9ff338b' \
            "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" consul -d "$RUNNER_TEMP/consul-fixture"
          echo "$RUNNER_TEMP/consul-fixture" >> "$GITHUB_PATH"
      - name: Link Linux x64 fixture against published dependencies
        run: |
          ./gradlew --no-daemon -I tools/ci/require-published-dependencies.init.gradle \
            -Pnetonstream.local=false :examples:external-config-contract:linkDebugExecutableLinuxX64
      - name: Run CFG-01 through CFG-05
        run: |
          python3 -B -u tools/ci/external_config_contract.py \
            examples/external-config-contract/build/bin/linuxX64/debugExecutable/external-config-contract.kexe
