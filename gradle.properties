org.gradle.jvmargs=-Xmx2g -Xms1g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
# ABI validation registers cross-project compilation inputs during configuration.
# Late project evaluation under configure-on-demand breaks that registration.
org.gradle.configureondemand=false
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Maven Central 发布（beta1）
netonVersion=1.0.0-beta25
netonGroup=com.netonstream
# 以下请放在 ~/.gradle/gradle.properties 或 CI secrets，勿提交：
# sonatypeUsername=<Central Portal Token 用户名>
# sonatypePassword=<Central Portal Token 密码>
# signing.keyId=<GPG Key ID>
# signing.password=<GPG 密钥密码>
# signing.secretKeyRingFile=<path/to/secring.gpg>

# 开发期源码替换：netonstream 协议栈（已发布）改用兄弟目录源码联调（spec/websocket.md §3）。发布时传 -Pnetonstream.local=false。
netonstream.local=true
